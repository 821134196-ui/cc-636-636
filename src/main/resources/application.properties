# HTTP
quarkus.http.port=8080

# SQLite 数据源（本地模拟邮箱 + 规则版本库）
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.jdbc.url=jdbc:sqlite:${app.data-dir:./data}/offboarding.db?busy_timeout=30000&foreign_keys=true&journal_mode=WAL&synchronous=NORMAL
# IDENTITY 主键在同一连接内取回 rowid，不再有序列表的第二连接；
# 单连接池把所有写事务串行化，彻底规避 SQLite 的 BUSY_SNAPSHOT
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=1
quarkus.datasource.jdbc.acquisition-timeout=30S

# Hibernate
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# 定时执行：到期扫描 + 失败同步任务重试
quarkus.scheduler.enabled=true
# 每次应用启动不覆盖已有数据，由 Seeder 幂等写入演示数据

# 本地模拟系统：允许通过 /api/admin/reset 清空并重新播种演示数据
app.allow-reset=true
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:./target/test-offboarding.db
# 测试中调度器关闭、用例串行，放宽连接数以避开启动期建表线程占用唯一连接
%test.quarkus.datasource.jdbc.min-size=1
%test.quarkus.datasource.jdbc.max-size=5
# 测试里手动驱动到期/重试，保证确定性
%test.quarkus.scheduler.enabled=false

# 日志
quarkus.log.category."com.corp".level=INFO
