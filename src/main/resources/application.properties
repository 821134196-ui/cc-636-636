# HTTP
quarkus.http.port=8080
quarkus.http.cors=false

# SQLite 数据源(本地嵌入式文件库)
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.jdbc.url=jdbc:sqlite:exitmail.db
# SQLite 为单写库,串行化连接避免 BUSY
quarkus.datasource.jdbc.max-size=1

# Hibernate / SQLite 方言
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# 调度器:到期检查与同步任务执行
quarkus.scheduler.enabled=true

# 敏感主题关键词(命中即禁止转发,逗号分隔,不区分大小写)
exitmail.sensitive-keywords=私人,私事,private,personal,confidential,机密,保密,薪资,工资,salary,password,密码,简历

# 同步任务最大自动重试次数
exitmail.sync.max-attempts=5
